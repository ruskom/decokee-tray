<svg xmlns="http://www.w3.org/2000/svg" width="980" height="610" viewBox="0 0 980 610" role="img" aria-labelledby="title desc">
  <title id="title">Decokee Quake tray controls popup</title>
  <desc id="desc">Dark mode screenshot-style image of the Decokee Quake Tray controls popup.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202124"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
  </defs>

  <rect width="980" height="610" fill="#0d1117"/>

  <g filter="url(#shadow)">
    <rect x="18" y="14" width="800" height="560" rx="18" fill="url(#panel)" stroke="#3a3d44" stroke-width="2"/>

    <text x="60" y="66" fill="#f3f4f6" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Decokee Quake</text>
    <text x="60" y="96" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Tray controls</text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#f3f4f6">
      <text x="64" y="158">Screen luminance</text>
      <text x="64" y="248">Knob brightness</text>
      <text x="64" y="338">Knob color</text>
      <text x="64" y="428">Button behavior</text>
      <text x="64" y="518">Knob behavior</text>
    </g>

    <g transform="translate(360 126)">
      <rect x="0" y="17" width="360" height="8" rx="4" fill="#e5e7eb"/>
      <g fill="#9ca3af">
        <rect x="14" y="50" width="3" height="8"/><rect x="52" y="50" width="3" height="8"/>
        <rect x="90" y="50" width="3" height="8"/><rect x="128" y="50" width="3" height="8"/>
        <rect x="166" y="50" width="3" height="8"/><rect x="204" y="50" width="3" height="8"/>
        <rect x="242" y="50" width="3" height="8"/><rect x="280" y="50" width="3" height="8"/>
        <rect x="318" y="50" width="3" height="8"/>
      </g>
      <rect x="91" y="0" width="24" height="45" rx="3" fill="#168ad8"/>
    </g>

    <g transform="translate(360 216)">
      <rect x="0" y="17" width="360" height="8" rx="4" fill="#e5e7eb"/>
      <g fill="#9ca3af">
        <rect x="14" y="50" width="3" height="8"/><rect x="52" y="50" width="3" height="8"/>
        <rect x="90" y="50" width="3" height="8"/><rect x="128" y="50" width="3" height="8"/>
        <rect x="166" y="50" width="3" height="8"/><rect x="204" y="50" width="3" height="8"/>
        <rect x="242" y="50" width="3" height="8"/><rect x="280" y="50" width="3" height="8"/>
        <rect x="318" y="50" width="3" height="8"/>
      </g>
      <rect x="38" y="0" width="24" height="45" rx="3" fill="#168ad8"/>
    </g>

    <g transform="translate(344 302)">
      <rect x="0" y="0" width="260" height="64" fill="#1c11ee" stroke="#020617" stroke-width="3"/>
      <text x="130" y="39" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">#1C11EE</text>
    </g>

    <g transform="translate(344 392)" font-family="Segoe UI, Arial, sans-serif">
      <rect x="0" y="0" width="392" height="48" fill="#2a2d33" stroke="#e5e7eb" stroke-width="3"/>
      <text x="14" y="31" fill="#f3f4f6" font-size="21">Move Window to Quake</text>
      <rect x="352" y="0" width="40" height="48" fill="#e5e7eb"/>
      <path d="M366 18h13l-6.5 8z" fill="#111827"/>
    </g>

    <g transform="translate(344 482)" font-family="Segoe UI, Arial, sans-serif">
      <rect x="0" y="0" width="392" height="48" fill="#2a2d33" stroke="#e5e7eb" stroke-width="3"/>
      <text x="14" y="31" fill="#f3f4f6" font-size="21">Switch Quake Windows</text>
      <rect x="352" y="0" width="40" height="48" fill="#e5e7eb"/>
      <path d="M366 18h13l-6.5 8z" fill="#111827"/>
    </g>

    <g transform="translate(58 548)" font-family="Segoe UI, Arial, sans-serif">
