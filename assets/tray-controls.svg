      <path d="M5 -7l5 6 9 -14" fill="none" stroke="#f3f4f6" stroke-width="3"/>
      <text x="34" y="0" fill="#f3f4f6" font-size="20">Keepalive</text>
      <text x="0" y="44" fill="#aeb6c2" font-size="18">Keepalive OK 22:13:24</text>
